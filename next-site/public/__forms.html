<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Project inquiry endpoint</title></head>
<body>
<form name="project-inquiry" method="POST" data-netlify="true" netlify-honeypot="websiteCompany" hidden>
  <input type="hidden" name="form-name" value="project-inquiry">
  <input name="name" type="text">
  <input name="email" type="email">
  <textarea name="problem"></textarea>
  <input name="submissionId" type="hidden">
  <input name="company" type="text">
  <input name="website" type="url">
  <input name="country" type="text">
  <input name="projectType" type="text">
  <input name="stage" type="text">
  <input name="budget" type="text">
  <input name="timeline" type="text">
  <input name="services" type="text">
  <input name="source" type="text">
  <textarea name="message"></textarea>
  <input name="consent" type="text">
  <input name="websiteCompany" type="text">
  <input name="utmSource" type="text">
  <input name="utmCampaign" type="text">
</form>
<p>Please use our <a href="/contact/">project inquiry form</a>.</p>
</body>
</html>
