# This repository contains one Next.js app in next-site.
[build]
  base = "next-site"
  command = "npm run lint && npm run typecheck && npm test && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

# Next.js is detected automatically; no pinned legacy adapter or SPA catch-all.
# Runtime secrets and SITE_* settings belong in the Netlify environment UI.
# Preview noindex is also enforced in lib/site-policy.ts.
