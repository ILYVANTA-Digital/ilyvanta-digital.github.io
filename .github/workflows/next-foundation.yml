name: Next.js agency checks
on:
  pull_request:
  push:
    branches: [development, 'feature/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: ilyvanta_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: next-site
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: next-site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:database
        env:
          TEST_DATABASE_URL: postgresql://postgres:disposable-ci-password@localhost:5432/ilyvanta_test
      - run: npm run build
      - run: npm run test:production
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Preserve browser review evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agency-browser-report
          path: |
            next-site/playwright-report/
            next-site/test-results/
          retention-days: 7
  performance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: next-site
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: next-site/package-lock.json
      - run: npm ci
      - name: Build the pre-motion comparison
        run: |
          git worktree add /tmp/ilyvanta-before 6eb78942636101a953415ae7d7b4eb4da08e4648
          npm ci --prefix /tmp/ilyvanta-before/next-site
          npm --prefix /tmp/ilyvanta-before/next-site run build
      - run: ANALYZE=true npm run build
      - name: Compare mobile and desktop Lighthouse
        run: node scripts/measure-lighthouse.mjs
        env:
          BASELINE_DIR: /tmp/ilyvanta-before/next-site
      - name: Preserve measured performance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-comparison
          path: |
            next-site/performance-results/
            next-site/.next/analyze/
          include-hidden-files: true
          retention-days: 14
